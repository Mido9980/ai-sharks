<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المساعد الذكي</title>
<link rel="icon" href="icons/i192.png">
<style>
:root{--bg:#070b10;--card:#0e1620;--line:rgba(232,195,106,.18);--gold:#e8c36a;--txt:#eef2f7;--mut:#93a3b5;--ok:#3ddc97}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,rgba(232,195,106,.10),transparent 60%),var(--bg);color:var(--txt);font-family:'Segoe UI',Tahoma,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(7,11,16,.85);backdrop-filter:blur(10px)}
.av{width:40px;height:40px;border-radius:12px;background:linear-gradient(150deg,rgba(232,195,106,.3),rgba(73,214,232,.2));display:grid;place-items:center;font-size:19px}
header b{display:block;font-size:15px}
header small{color:var(--ok);font-size:11.5px}
.chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:85%;padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.bot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);align-self:flex-start;border-end-start-radius:5px}
.me{background:linear-gradient(135deg,#f6dd9c,var(--gold));color:#171208;font-weight:600;align-self:flex-end;border-end-end-radius:5px}
.typing{display:flex;gap:5px;padding:13px 16px;align-self:flex-start;background:rgba(255,255,255,.05);border-radius:16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.5;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
form{display:flex;gap:9px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02)}
input{flex:1;background:#0a1119;border:1px solid rgba(255,255,255,.09);color:var(--txt);border-radius:999px;padding:13px 18px;font-family:inherit;font-size:14.5px;outline:none}
input:focus{border-color:var(--line)}
button{width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(135deg,#f6dd9c,var(--gold));color:#141007;font-size:19px;cursor:pointer;flex:0 0 auto}
button:disabled{opacity:.5}
.err{padding:20px;color:#ffb4a2;text-align:center;font-size:14px}
.foot{text-align:center;font-size:11px;color:var(--mut);padding:0 0 10px}
</style>
</head>
<body>
<header><div class="av">🤖</div><div><b id="tname">جارٍ التحميل…</b><small>● متصل</small></div></header>
<div class="chat" id="chat"></div>
<form id="form"><input id="q" placeholder="اكتب سؤالك…" maxlength="500" autocomplete="off"><button id="send" aria-label="إرسال">➤</button></form>
<div class="foot">مدعوم بواسطة AI Sharks · EASY CODE</div>
<script>
(function(){
  var API='https://shark-vision-labs.base44.app/functions/sharkTenant';
  var slug=new URLSearchParams(location.search).get('t')||'';
  var chat=document.getElementById('chat'),form=document.getElementById('form'),q=document.getElementById('q'),send=document.getElementById('send'),tname=document.getElementById('tname');
  var hist=[],busy=false;
  function bubble(text,who){var d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
  function typing(){var d=document.createElement('div');d.className='typing';d.innerHTML='<i></i><i></i><i></i>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
  if(!slug){chat.innerHTML='<div class="err">الرابط غير صحيح — تواصل مع الشركة.</div>';form.style.display='none';return;}
  fetch(API+'?slug='+encodeURIComponent(slug)).then(function(r){return r.json();}).then(function(d){
    if(!d.ok){chat.innerHTML='<div class="err">'+(d.error||'الوكيل غير متاح')+'</div>';form.style.display='none';return;}
    tname.textContent=d.tenant.name;
    document.title=d.tenant.name;
    bubble(d.tenant.greeting,'bot');
    if(d.tenant.status!=='active'){bubble('الخدمة مش مفعّلة حالياً، تواصل مع الشركة مباشرة.','bot');form.style.display='none';}
  }).catch(function(){chat.innerHTML='<div class="err">تعذر الاتصال — جرب تحديث الصفحة.</div>';});
  function ask(text){
    text=(text||'').trim(); if(!text||busy) return;
    busy=true;send.disabled=true;
    bubble(text,'me');hist.push({role:'user',content:text.slice(0,500)});q.value='';
    var t=typing();
    fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'chat',slug:slug,messages:hist.slice(-8)})})
      .then(function(r){return r.json();})
      .then(function(d){
        t.remove();
        if(d.ok){bubble(d.reply,'bot');hist.push({role:'assistant',content:d.reply});}
        else bubble(d.error||'حصلت مشكلة، جرب تاني.','bot');
      })
      .catch(function(){t.remove();bubble('النت قطع — جرب تاني.','bot');})
      .finally(function(){busy=false;send.disabled=false;q.focus();});
  }
  form.addEventListener('submit',function(e){e.preventDefault();ask(q.value);});
})();
</script>
</body>
</html>
